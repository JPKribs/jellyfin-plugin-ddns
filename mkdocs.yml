site_name: Dynamic DNS
site_description: A Jellyfin plugin that keeps your DNS records pointed at your server's current public IP.
site_url: https://jpkribs.github.io/jellyfin-plugin-ddns/
repo_url: https://github.com/JPKribs/jellyfin-plugin-ddns
repo_name: JPKribs/jellyfin-plugin-ddns
edit_uri: edit/master/docs/
docs_dir: docs

theme:
  name: material
  logo: assets/icon.png
  favicon: assets/icon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Getting Started:
      - Installation: Installation.md
      - Adding Records: Records.md
  - Features:
      - How Updates Run: HowItWorks.md
