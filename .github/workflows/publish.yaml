name: '🚀 Publish Plugin'

on:
  release:
    types:
      - released
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (e.g. v10.11.3.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Release Info
        id: release_info
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          # The tag is the single source of truth. A manual dispatch must name one explicitly, so a
          # run without a tag can never hash a 404 page into the manifest every user's server fetches.
          TAG="${RELEASE_TAG:-${INPUT_TAG:-}}"
          if [ -z "$TAG" ]; then
            echo "No release tag available; refusing to touch the manifest." >&2
            exit 1
          fi

          # The version comes from the tag itself, not from build.yaml at current master, so publishing
          # an older release cannot pick up a version a later auto-increment wrote into build.yaml.
          BUILD_VERSION="${TAG#v}"

          # Read targetAbi from build.yaml as it was at the tag, falling back to master's copy.
          git fetch --depth 1 origin "refs/tags/${TAG}:refs/tags/${TAG}" 2>/dev/null || true
          TARGET_ABI=$(git show "refs/tags/${TAG}:build.yaml" 2>/dev/null | sed -n 's/^targetAbi:[[:space:]]*//p' | tr -d '"' || true)
          if [ -z "$TARGET_ABI" ]; then
            TARGET_ABI=$(sed -n 's/^targetAbi:[[:space:]]*//p' build.yaml | tr -d '"')
          fi

          BASE_URL="https://github.com/JPKribs/jellyfin-plugin-ddns/releases/download/${TAG}"
          ASSET="jellyfin-plugin-ddns-${BUILD_VERSION}.zip"

          # -f on every download: a missing asset must fail the job rather than hashing an error page.
          CHECKSUM=$(curl -sfL "${BASE_URL}/${ASSET}.md5" | cut -d' ' -f1 || true)
          if [ -z "$CHECKSUM" ]; then
            echo "Checksum download failed, calculating from ZIP file..."
            curl -sfL -o temp_plugin.zip "${BASE_URL}/${ASSET}"
            CHECKSUM=$(md5sum temp_plugin.zip | cut -d' ' -f1)
            rm temp_plugin.zip
          fi

          if ! echo "$CHECKSUM" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "Checksum '${CHECKSUM}' does not look like an MD5 hash; aborting." >&2
            exit 1
          fi

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "Tag: ${TAG}"
          echo "Build Version: ${BUILD_VERSION}"
          echo "Target ABI: ${TARGET_ABI}"
          echo "Checksum: ${CHECKSUM}"

          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "build_version=${BUILD_VERSION}" >> $GITHUB_OUTPUT
          echo "target_abi=${TARGET_ABI}" >> $GITHUB_OUTPUT
          echo "checksum=${CHECKSUM}" >> $GITHUB_OUTPUT
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT

      - name: Update Manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_info.outputs.tag }}
          BUILD_VERSION: ${{ steps.release_info.outputs.build_version }}
          TARGET_ABI: ${{ steps.release_info.outputs.target_abi }}
          CHECKSUM: ${{ steps.release_info.outputs.checksum }}
          TIMESTAMP: ${{ steps.release_info.outputs.timestamp }}
        run: |
          set -euo pipefail

          # The release body reaches the shell only through gh and env vars, never through workflow
          # template interpolation, so quotes or $() in a changelog cannot execute or break the job.
          RELEASE_BODY=$(gh release view "$TAG" --json body --jq '.body // ""')
          SANITIZED_CHANGELOG=$(printf '%s' "$RELEASE_BODY" | tr -d '`')

          # Use jq to safely construct the JSON object
          NEW_VERSION=$(jq -n \
            --arg version "$BUILD_VERSION" \
            --arg changelog "$SANITIZED_CHANGELOG" \
            --arg targetAbi "$TARGET_ABI" \
            --arg sourceUrl "https://github.com/JPKribs/jellyfin-plugin-ddns/releases/download/${TAG}/jellyfin-plugin-ddns-${BUILD_VERSION}.zip" \
            --arg checksum "$CHECKSUM" \
            --arg timestamp "$TIMESTAMP" \
            '{
              version: $version,
              changelog: $changelog,
              targetAbi: $targetAbi,
              sourceUrl: $sourceUrl,
              checksum: $checksum,
              timestamp: $timestamp
            }')

          # Prepend the new version, replacing any existing entry for it so a re-run stays idempotent.
          jq --argjson newVersion "$NEW_VERSION" \
            '.[0].versions = [$newVersion] + [ .[0].versions[] | select(.version != $newVersion.version) ]' \
            manifest.json > manifest_temp.json
          mv manifest_temp.json manifest.json

      - name: Commit Changes
        env:
          TAG: ${{ steps.release_info.outputs.tag }}
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add manifest.json
          git commit -m "Update manifest for release ${TAG}" || exit 0
          git push origin HEAD:master
